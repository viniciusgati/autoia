[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autoia"
version = "0.1.0"
description = "Plataforma web de pipeline autônomo de desenvolvimento (robôs LLM)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  # Upload multipart de `.zip` de skills (FastAPI exige para `UploadFile`/`File`).
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[project.scripts]
autoia-api = "app.main:run_api"
autoia-worker = "app.main:run_worker"
autoia-chamado-worker = "app.main:run_chamado_worker"
autoia-chat-worker = "app.main:run_chat_worker"
autoia-stop = "app.stopall:run_stop"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
